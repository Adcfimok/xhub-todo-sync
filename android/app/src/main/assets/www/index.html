<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#12131b" />
<title>x-hub 手机端</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-in">
        <button class="back" id="btn-back" type="button" hidden aria-label="返回">‹</button>
        <h1 id="page-title">首页</h1>
        <button class="status-chip" id="status-chip" type="button" data-state="offline" aria-label="同步状态">
          <i class="dot"></i><span id="status-text">未配对</span>
        </button>
      </div>
    </header>

    <main class="page" id="page"></main>

    <nav class="tabbar" id="tabbar">
      <span class="tab-indicator" id="tab-indicator" aria-hidden="true"><i></i></span>

      <button class="tab" data-route="home" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.4 3.3a1 1 0 0 1 1.2 0l8 6.2c.3.2.4.5.4.8V20a1 1 0 0 1-1 1h-5.2v-6.2H9.2V21H4a1 1 0 0 1-1-1v-9.7c0-.3.1-.6.4-.8l8-6.2z"/></svg>
        <span>首页</span>
      </button>

      <button class="tab" data-route="todos" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="4.6" width="13" height="2.9" rx="1.45"/><rect x="3" y="10.6" width="13" height="2.9" rx="1.45"/><rect x="3" y="16.6" width="8.5" height="2.9" rx="1.45"/><circle cx="20" cy="6.05" r="1.7"/><circle cx="20" cy="12.05" r="1.7"/></svg>
        <span>待办</span>
      </button>

      <button class="tab-add" id="btn-quick-add" type="button" aria-label="新建">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
      </button>

      <button class="tab" data-route="ai" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.2 2.8a.7.7 0 0 1 1.6 0l1.5 4.4 4.4 1.5a.7.7 0 0 1 0 1.6l-4.4 1.5-1.5 4.4a.7.7 0 0 1-1.6 0L9.7 11.7 5.3 10.2a.7.7 0 0 1 0-1.6l4.4-1.5 1.5-4.3z"/><path d="M18.4 15.1c.2-.5.9-.5 1.1 0l.7 2 2 .7c.5.2.5.9 0 1.1l-2 .7-.7 2c-.2.5-.9.5-1.1 0l-.7-2-2-.7c-.5-.2-.5-.9 0-1.1l2-.7.7-2z"/></svg>
        <span>AI</span>
      </button>

      <button class="tab" data-route="more" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="7.6" r="4.1"/><path d="M12 13.6c-4.3 0-7.8 2.5-7.8 5.6 0 .4.3.8.8.8h14c.5 0 .8-.4.8-.8 0-3.1-3.5-5.6-7.8-5.6z"/></svg>
        <span>我的</span>
      </button>
    </nav>
  </div>

  <div class="sheet-mask" id="sheet-mask" hidden></div>
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <button class="link" id="btn-cancel" type="button">取消</button>
      <b id="sheet-title">编辑</b>
      <button class="link accent" id="btn-save" type="button">保存</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
    <button class="btn danger block" id="btn-delete" type="button" hidden>删除</button>
  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- 底栏「＋」的类型选择：先选类型，再进对应表单 -->
  <div class="add-mask" id="add-mask" hidden></div>
  <div class="add-picker" id="add-picker" hidden role="dialog" aria-label="新建">
    <div class="sheet-grab"></div>
    <div class="add-head">新建</div>
    <div class="add-list">
      <button class="add-item" type="button" data-type="todos">
        <span class="ai-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h2.2l1.1 1.4L9.8 5"/><path d="M4 14.5h2.2l1.1 1.4L9.8 13"/><path d="M12.5 6.5H20"/><path d="M12.5 14.5H20"/></svg>
        </span>
        <span class="ai-body">
          <span class="ai-t">待办</span>
          <span class="ai-d">要做什么、什么时候提醒</span>
        </span>
        <span class="ai-go">›</span>
      </button>
      <button class="add-item" type="button" data-type="notes">
        <span class="ai-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h7l5 5v12a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1z"/><path d="M13 3.5v5.5h5.5"/><path d="M8.5 13h7M8.5 16.5h4.5"/></svg>
        </span>
        <span class="ai-body">
          <span class="ai-t">笔记</span>
          <span class="ai-d">长文本，正文同步到电脑</span>
        </span>
        <span class="ai-go">›</span>
      </button>
      <button class="add-item" type="button" data-type="snippets">
        <span class="ai-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 7.5 5 12l4.5 4.5"/><path d="M14.5 7.5 19 12l-4.5 4.5"/></svg>
        </span>
        <span class="ai-body">
          <span class="ai-t">提示词</span>
          <span class="ai-d">常用话术，一键复制</span>
        </span>
        <span class="ai-go">›</span>
      </button>
    </div>
  </div>
  <div class="scan" id="scan" hidden>
    <video id="scan-video" playsinline muted></video>
    <div class="scan-frame"></div>
    <div class="scan-bar">
      <p>对准电脑上的二维码</p>
      <button class="btn" id="btn-scan-close" type="button">关闭</button>
    </div>
  </div>

  <script src="./vendor/jsQR.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
